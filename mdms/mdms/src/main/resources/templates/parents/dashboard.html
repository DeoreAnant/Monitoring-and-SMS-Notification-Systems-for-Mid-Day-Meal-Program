<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body >
    
    <div
    data-th-insert="~{parents/parent_navbar :: parent-navbar}">
    </div>
    <div class="bg-gray-100 flex items-center justify-center min-h-10 mt-4 p-6">
    <!-- Card Container -->
    <div id="recipients" class="bg-white shadow-lg rounded-xl p-4 max-w-5xl w-full">
        
        <h2 class="text-2xl font-semibold text-gray-800 mb-4 text-center">Student Attendance</h2>

        <div class="overflow-x-auto">
            <table class="min-w-full border border-gray-300 bg-white text-gray-900 shadow-xl rounded-lg overflow-hidden">
                <thead class="bg-gray-800 text-white">
                    <tr class="divide-x divide-gray-400">
                        <th class="px-6 py-4 text-left text-lg font-bold uppercase tracking-wide border-r border-gray-300">Name</th>
                        <th class="px-6 py-4 text-left text-lg font-bold uppercase tracking-wide border-r border-gray-300">MDM ID</th>
                        <th class="px-6 py-4 text-left text-lg font-bold uppercase tracking-wide border-r border-gray-300">Roll No</th>
                        <th class="px-6 py-4 text-left text-lg font-bold uppercase tracking-wide border-r border-gray-300">Standard</th>
                        <th class="px-6 py-4 text-left text-lg font-bold uppercase tracking-wide border-r border-gray-300">Date</th>
                        <th class="px-6 py-4 text-left text-lg font-bold uppercase tracking-wide border-r border-gray-300">Attendance</th>
                        <th class="px-6 py-4 text-left text-lg font-bold uppercase tracking-wide">Received Meal</th>
                    </tr>
                </thead>
                <tbody class="bg-gray-50 divide-y divide-gray-300">
                    <tr th:each="student : ${student}" class="hover:bg-gray-100 transition duration-150 ease-in-out border-b border-gray-300">
                        <td class="px-6 py-4 text-md font-semibold text-gray-900 border-r border-gray-300 align-top" th:text="${student.studentName}">Tiger Nixon</td>
                        <td class="px-6 py-4 text-md font-medium text-gray-700 border-r border-gray-300 align-top" th:text="${student.student_mdm_id}">ED1234</td>
                        <td class="px-6 py-4 text-md font-medium text-gray-700 border-r border-gray-300 align-top" th:text="${student.student_Roll_No}">61</td>
                        <td class="px-6 py-4 text-md font-medium text-gray-700 border-r border-gray-300 align-top" th:text="${student.student_Standard}">5th</td>
            
                        <td colspan="3" class="p-0 border-t border-gray-300">
                            <table class="w-full table-fixed">
                                <tbody>
                                    <tr th:each="attendance : ${student.attendances}" class="divide-x divide-gray-300 border-t border-gray-200">
                                        <td class="px-4 py-2 text-md text-gray-700 border-r border-gray-300" th:text="${attendance.date}">2025-04-04</td>
                                        <td class="px-4 py-2 text-md text-gray-700 border-r border-gray-300" th:text="${attendance.attended}">true</td>
                                        <td class="px-4 py-2 text-md text-gray-700" th:text="${attendance.receivedMeal}">true</td>
                                    </tr>
                                </tbody>
                            </table>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            
        </div>

    </div>
</div>

</body>
</html>
